<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>问卷管理 · Peerly</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-page">
  <section id="login-view" class="login-card">
    <p class="kicker">PEERLY ADMIN</p><h1>管理问卷</h1><p>输入管理员密码，查看和比较收到的回复。</p>
    <form id="login-form"><label class="field"><span>管理员密码</span><input type="password" name="password" autocomplete="current-password" required></label><button class="button-primary" type="submit"><span>登录</span><span>→</span></button><p id="login-message" class="form-message error"></p></form>
  </section>
  <main id="dashboard" class="admin-shell hidden">
    <header class="admin-top"><div><p class="kicker">PEERLY ADMIN</p><h2>问卷回复</h2></div><div class="admin-actions"><a class="button-secondary" href="/api/admin/export">导出 CSV</a><button id="logout" class="button-secondary">退出</button></div></header>
    <p class="stats">共收到 <strong id="count">0</strong> 位学生的最新回复</p>
    <div class="view-tabs"><button class="button-secondary view-tab active" data-view="students">按学生查看</button><button class="button-secondary view-tab" data-view="questions">按问题比较</button></div>
    <section id="student-view" class="records"></section><section id="question-view" class="hidden"></section>
  </main>
  <script src="questionnaire.js"></script><script src="admin.js"></script>
</body>
</html>
