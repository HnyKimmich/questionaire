<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Peerly · 在第一次见面前，轻松认识一下彼此">
  <title>Peerly · 见面前的小问卷</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="questionnaire-page">
  <div class="questionnaire-shell">
    <aside class="questionnaire-sidebar">
      <a class="brand" href="/" aria-label="Peerly 首页"><span class="brand-mark">P</span><span>Peerly</span></a>
      <div class="sidebar-copy">
        <p class="eyebrow">BEFORE WE MEET</p>
        <h1>先认识一下<br><em>彼此</em></h1>
        <p>没有标准答案，也不用每题都填。你回答之后，还会看到我的答案。</p>
      </div>
      <nav id="chapter-nav" class="chapter-nav" aria-label="问卷进度"></nav>
      <p class="draft-status"><span id="save-dot"></span><span id="save-status">回答会自动保存在这台设备</span></p>
      <div class="orb orb-one"></div><div class="orb orb-two"></div>
    </aside>

    <main class="questionnaire-main">
      <form id="questionnaire" novalidate>
        <label class="website-field" aria-hidden="true">网站<input name="website" tabindex="-1" autocomplete="off"></label>
        <section class="step-panel active" data-step="0" aria-labelledby="welcome-title">
          <div class="intro-panel">
            <p class="kicker">HELLO THERE</p>
            <h2 id="welcome-title">开始之前，怎么称呼你？</h2>
            <p class="panel-lead">姓名是唯一必填项。同名再次提交时，会用这一次的回答覆盖上一次。</p>
            <label class="name-field"><span>你的姓名</span><input id="student-name" name="name" maxlength="60" autocomplete="name" placeholder="在这里输入姓名" required></label>
            <div class="intro-notes"><span>约 5–8 分钟</span><span>可以跳过任何题目</span><span>可随时返回修改</span></div>
          </div>
        </section>
        <div id="chapters"></div>
        <div class="form-actions">
          <button id="previous-step" class="button-ghost" type="button">← 上一步</button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          <button id="next-step" class="button-primary" type="button"><span>下一步</span><span>→</span></button>
          <button id="submit-form" class="button-primary hidden" type="submit"><span>提交问卷</span><span>↗</span></button>
        </div>
      </form>
      <section id="success-view" class="success-view hidden" aria-live="polite">
        <span class="success-mark">✓</span><p class="kicker">ALL DONE</p><h2>谢谢你认真填完。</h2><p>你的回答已经收到，我们见面聊。</p>
      </section>
    </main>
  </div>

  <div id="draft-dialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="draft-title">
    <div class="dialog-card"><p class="kicker">WELCOME BACK</p><h2 id="draft-title">发现一份未提交的回答</h2><p>要接着上次的位置继续，还是重新开始？</p><div class="dialog-actions"><button id="restart-draft" class="button-ghost" type="button">重新开始</button><button id="continue-draft" class="button-primary" type="button"><span>继续填写</span><span>→</span></button></div></div>
  </div>

  <script src="questionnaire.js"></script>
  <script src="app.js"></script>
</body>
</html>
